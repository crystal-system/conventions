name: Scopes file check
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout conventions
        uses: actions/checkout@v4
        with:
          repository: crystal-system/conventions
          path: conventions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Validate scopes.yaml
        run: python conventions/cs_conventions/validate_scopes.py scopes.yaml
